<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abo-Manager</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            color: #000;
            background-color: #fff;
        }

        header {
            background-color: #000;
            color: #fff;
            padding: 15px 30px;
        }

        header h1 {
            margin: 0 0 10px 0;
            font-size: 24px;
        }

        nav a {
            color: #fff;
            text-decoration: none;
            margin-right: 20px;
        }

        nav a:hover {
            text-decoration: underline;
        }

        main {
            padding: 30px;
        }

        main a {
            color: #000;
        }

        .hinweis {
            border: 2px solid #000;
            padding: 10px;
            margin-bottom: 20px;
        }

        table {
            border-collapse: collapse;
            width: 100%;
        }

        th, td {
            border-bottom: 1px solid #ccc;
            padding: 8px;
            text-align: left;
        }

        th {
            border-bottom: 2px solid #000;
        }
    </style>
</head>
